name: docs-test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "README.md"
      - ".github/actions/setup/**"
      - ".github/workflows/docs.test.yml"
      - "docs/**"
      - "examples/**"
      - "packages/**"
      - "scripts/verify-docs.mjs"
      - "scripts/verify-snippets.mjs"
      - "scripts/snippets.*.d.ts"

permissions:
  contents: read

concurrency:
  group: docs-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    env:
      DOCS_SITE_URL: https://priemskiyyy.github.io/flare/
      DOCS_BASE_PATH: /flare/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      # The examples are typechecked against the declarations the packages ship.
      - name: Build packages
        run: pnpm build

      - name: Typecheck every documented example
        run: pnpm verify:snippets

      - name: Check documentation config types
        run: pnpm lint:docs

      - name: Build documentation
        run: pnpm build:docs

      - name: Verify links, anchors and metadata
        run: pnpm verify:docs
