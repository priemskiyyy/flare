name: Bug report
description: Report incorrect behavior with a reproducible example.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Link a minimal repository or provide steps and a small code example. Include the Flare configuration, the destinations involved, and whether the report was captured before `start()`.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: Include Flare packages, the provider SDK and its version, framework, browser, Node or React Native version, and operating system.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Receipt and diagnostics
      description: Include the receipt's settled status and the devtools timeline or `flare.diagnostics` events for the report. Diagnostics hold no report content, but remove tokens, credentials and personal data from anything else you paste.
